name: TinyTakt

on:
  pull_request:
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read


env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test
      - name: Datenschutz-/Abhängigkeitsprüfung
        run: |
          scripts/check_privacy_deps.sh
          scripts/check_version.sh
          flutter pub outdated || true
      - name: Schwachstellen-Scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
        continue-on-error: true

  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signierung (nur wenn Secrets vorhanden)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          else
            echo "Kein Keystore-Secret: AAB bleibt unsigniert (nur Build-Nachweis)."
          fi
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: tinytakt-aab
          path: build/app/outputs/bundle/release/*.aab

  ios:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS-Build ohne Signierung (Kompilierungsnachweis)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      # Signierter IPA-Export/TestFlight: siehe docs/RELEASE.md (Fastlane, benötigt App-Store-Connect-API-Key als Secret).
      - uses: actions/upload-artifact@v4
        with:
          name: tinytakt-ios-runner
          path: build/ios/iphoneos/Runner.app
